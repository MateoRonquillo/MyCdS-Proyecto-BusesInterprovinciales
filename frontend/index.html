<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f1" />
    <script>try{const t=localStorage.getItem('pasajes-tema');const d=t==='oscuro'||(!['claro','oscuro'].includes(t)&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'oscuro':'claro';document.documentElement.style.colorScheme=d?'dark':'light';document.querySelector('meta[name="theme-color"]')?.setAttribute('content',d?'#0d1117':'#f4f5f1')}catch{}</script>
    <title>Pasajes EC</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
